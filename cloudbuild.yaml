timeout: "1800s"
substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: lumina-live-backend
  _REPO_NAME: lumina-live-sg
  _IMAGE_NAME: backend
  _PLATFORM: managed
steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA
      - ./backend
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=${_PLATFORM}
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=2
      - --timeout=3600
      - --concurrency=80
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_APPLICATION_CREDENTIALS=/secrets/service-account.json
      - --set-secrets=GOOGLE_API_KEY=GEMINI_API_KEY:latest,/secrets/service-account.json=FIREBASE_SERVICE_ACCOUNT:latest
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
